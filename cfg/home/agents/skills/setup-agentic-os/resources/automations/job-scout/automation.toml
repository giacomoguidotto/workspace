# Canonical behavior source. Schedule, timezone, working directory, project,
# status, and runtime history remain installation-local materialization state.
schema_version = 1
# Preserve this legacy identity when updating an existing materialization.
id = "career-ops-scan-and-evaluate"
kind = "cron"
name = "Job Scout"

execution_profile = "balanced/medium"
prompt_file = "prompt.md"

[invocation]
capability = "agentic-os.scout"
arguments = ["--target", "30"]

[validation]
profile = "non-publishing-no-write"
invoke_capability = false
source_capabilities = []
sink_capabilities = []
prohibited_actions = [
  "application",
  "outreach",
  "message",
  "knowledge-write",
  "career-write",
  "publish",
]
