# Canonical behavior source. Schedule, timezone, working directory, project,
# status, and other materialization state remain installation-local bindings.
schema_version = 1
# Preserve this legacy identity when updating an existing materialization.
id = "renovate-pr-ci-fixer"
kind = "cron"
name = "Repo PR CI Repair Sweep"

execution_profile = "balanced/high"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "local"
destination = "local"

prompt_file = "prompt.md"

[authority_boundary]
coordinator = "authenticated-policy-only"
worker = "credentialless-network-disabled-sandbox"
github_credentials = "absent"
repository_network = "disabled"
on_unavailable = "blocked"
untrusted_content = [
  "pull-request-head",
  "pull-request-body",
  "comments",
  "repository-instructions",
  "workflow-definitions",
  "workflow-logs",
  "check-output",
]
